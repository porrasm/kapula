name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the reference host image
        run: docker build -t kapula:ci .
      - name: Boot it and probe the API
        run: |
          docker run -d --rm -p 4310:4310 -e KAPULA_OWNER_TOKEN=ci --name kapula kapula:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4310/api/health && break
            sleep 1
          done
          curl -sf http://localhost:4310/api/health
          curl -sf http://localhost:4310/ | grep -q '<title>Kapula</title>'
          docker stop kapula
